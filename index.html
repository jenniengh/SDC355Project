<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDC355 - Project</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
   <header>
       <h1>SDC 355 - Project</h1>

        <h2 id="greetings">Hello!</h2>
       <nav>
           <ul>
               <li><a href="#about">About</a></li>
               <li><a href="#projects">Projects</a></li>
               <li><a href="#contact">Contact</a></li>
           </ul>
       </nav>
   </header>

   <main>
        <!-- About Section -->
        <section id="about">
            <h2>About</h2>
            <p>My name is Jennie.</p>
            <p>I am a student at ECPI University.</p>
        </section>

        <!-- Projects Section -->
        <section id="projects">
            <h2>Projects</h2>
            <p>Here are some projects I created in my previous classes.</p>

            <section id="project-grid" class="project-grid">
                <!-- dynamically generate project cards here -->
            </section>

        </section>

        <!-- Contact Section -->
        <section id="contact">
            <h2>Contact</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required>
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit">Send</button>
                <button type="reset">Clear form</button>
            </form>
        </section>
   </main>

   <footer>
       <p>&copy; 2026 Jennie Nguyen</p>
   </footer>
</body>
</html>
